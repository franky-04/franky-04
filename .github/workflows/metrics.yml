name: Metrics
on:
  # Esegui ogni giorno a mezzanotte
  schedule: [{cron: "0 0 * * *"}]
  # Permetti l'esecuzione manuale
  workflow_dispatch:
  # Esegui anche dopo un push al branch principale (opzionale)
  push: {branches: ["main", "master"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: franky-04
          # Configurazione template
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Rome
          
          # Plugin per linee di codice
          plugin_lines: yes
          
          # Plugin per il calendario contributi
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Plugin per i linguaggi
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_categories: programming
          plugin_languages_threshold: 2%
          
          # Mostra contributi alle organizzazioni
          repositories_affiliations: owner, collaborator, organization_member
          # Aggiungi questi parametri nella sezione with:

          # Mostra achievement badge
          plugin_achievements: yes
          plugin_achievements_threshold: B      # Livello minimo (S/A/B/C)
          plugin_achievements_secrets: yes      # Mostra achievement segreti
          plugin_achievements_display: compact  # Stile di visualizzazione
          
          # Mostra statistiche di follow
          plugin_people: yes
          plugin_people_types: followers, following
          
          # Mostra repository notevoli
          plugin_notable: yes
          plugin_notable_repositories: yes
